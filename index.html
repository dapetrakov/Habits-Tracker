<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f8f5b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Habits">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Main list of habits -->
  <main class="app" id="list-view">
    <header class="top">
      <h1>Habits</h1>
      <p id="today-label" class="muted"></p>
    </header>

    <section class="progress" aria-live="polite">
      <div class="progress-bar"><div id="progress-fill"></div></div>
      <p id="progress-text" class="muted"></p>
    </section>

    <form id="add-form" class="add-form" autocomplete="off">
      <input id="habit-input" type="text" placeholder="New habit, e.g. Drink water" maxlength="60" required aria-label="New habit name">
      <button type="submit">Add</button>
    </form>

    <div class="week-head" id="week-head" aria-hidden="true"></div>
    <ul id="habit-list" class="habit-list"></ul>
    <p id="empty" class="empty muted" hidden>No habits yet. Add one above to get started.</p>
    <p id="list-hint" class="hint muted" hidden>Tap a habit's name to see its full history.</p>
  </main>

  <!-- History of one habit -->
  <main class="app" id="detail-view" hidden>
    <header class="detail-top">
      <button id="back" class="back" type="button">‹ Habits</button>
      <h1 id="detail-name"></h1>
    </header>

    <section class="stats" aria-label="Streaks and totals">
      <div class="stat stat-main">
        <span class="stat-value" id="stat-current">0</span>
        <span class="stat-label">Current streak</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-best">0</span>
        <span class="stat-label">Best streak</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Days done</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-rate">0%</span>
        <span class="stat-label">Last 30 days</span>
      </div>
    </section>
    <p id="streak-note" class="streak-note muted"></p>

    <section class="card calendar" aria-label="Calendar">
      <div class="cal-head">
        <button id="prev-month" class="nav" type="button" aria-label="Previous month">‹</button>
        <h2 id="month-label"></h2>
        <button id="next-month" class="nav" type="button" aria-label="Next month">›</button>
      </div>
      <div class="cal-grid cal-weekdays" id="cal-weekdays" aria-hidden="true"></div>
      <div class="cal-grid" id="cal-days"></div>
      <p class="muted small">Tap a day to mark it done or not done.</p>
    </section>

    <section class="card">
      <h2>Month by month</h2>
      <ul id="months" class="months"></ul>
    </section>
  </main>

  <template id="habit-template">
    <li class="habit">
      <button class="check" type="button" aria-label="Mark done today"></button>
      <button class="info" type="button">
        <span class="name"></span>
        <span class="streak muted"></span>
      </button>
      <div class="days"></div>
      <button class="delete" type="button" aria-label="Delete habit" title="Delete">×</button>
    </li>
  </template>

  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
    }
  </script>
</body>
</html>
