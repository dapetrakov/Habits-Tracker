name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir _site
          cp -r *.html *.css *.js *.webmanifest icons _site/
      - name: Check every file the app needs is in the site
        run: |
          missing=0
          # Files referenced by the page (src/href) and cached by the service worker
          refs=$(grep -oE '(src|href)="[^"#:]+"' index.html | sed -E 's/^(src|href)="(.*)"$/\2/'
                 grep -oE '"[^"]+\.(html|css|js|webmanifest|png)"' sw.js | tr -d '"')
          for f in $refs; do
            if [ ! -f "_site/$f" ]; then echo "::error::Missing from site: $f"; missing=1; fi
          done
          exit $missing
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
