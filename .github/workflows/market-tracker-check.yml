name: Market Tracker check

# Validates data files, runs tests and builds the Market Tracker whenever it changes.
# Does not deploy anything.
on:
  push:
    paths: ['market-tracker/**', '.github/workflows/market-tracker-check.yml']
  pull_request:
    paths: ['market-tracker/**', '.github/workflows/market-tracker-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-tracker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: market-tracker/package-lock.json
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
